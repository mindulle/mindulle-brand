<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Mindulle Responsive Favicon 64 (Direction A: Floating Pappus Seed) -->
  <style>
    :root {
      --stem-color: #161616;
      --seed-color: #D97706;
      --plume-color: #161616;
      --accent-color: #D97706;
      --halo-color: rgba(217, 119, 6, 0.12);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --stem-color: #F7EEEC;
        --seed-color: #F59E0B;
        --plume-color: #F7EEEC;
        --accent-color: #FBBF24;
        --halo-color: rgba(245, 158, 11, 0.16);
      }
    }
    .stem { stroke: var(--stem-color); }
    .seed { fill: var(--seed-color); }
    .plume { stroke: var(--plume-color); }
    .accent { fill: var(--accent-color); }
    .halo { fill: var(--halo-color); }
  </style>

  <!-- 1. Soft Gold Aura behind parachute canopy -->
  <circle cx="32" cy="18" r="15" class="halo" />

  <!-- 2. Parachute Plumes (7 radiating ribs) -->
  <line x1="32" y1="28" x2="32" y2="6" stroke-width="2" stroke-linecap="round" class="plume" />
  <line x1="32" y1="28" x2="21" y2="9" stroke-width="2" stroke-linecap="round" class="plume" />
  <line x1="32" y1="28" x2="43" y2="9" stroke-width="2" stroke-linecap="round" class="plume" />
  <line x1="32" y1="28" x2="12" y2="16" stroke-width="2" stroke-linecap="round" class="plume" />
  <line x1="32" y1="28" x2="52" y2="16" stroke-width="2" stroke-linecap="round" class="plume" />
  <line x1="32" y1="28" x2="7" y2="25" stroke-width="1.75" stroke-linecap="round" class="plume" />
  <line x1="32" y1="28" x2="57" y2="25" stroke-width="1.75" stroke-linecap="round" class="plume" />

  <!-- 3. Curved Wind Canopy Line -->
  <path d="M 7 25 Q 32 3 57 25" stroke-width="1.25" stroke-linecap="round" stroke-dasharray="2 3" class="plume" opacity="0.6" />

  <!-- 4. Parachute Vertex Node -->
  <circle cx="32" cy="28" r="2.5" class="accent" />

  <!-- 5. Central Stalk (The True 2px Stem, 2.5px for 64px scale) -->
  <line x1="32" y1="28" x2="32" y2="47" stroke-width="2.5" stroke-linecap="round" class="stem" />

  <!-- 6. Teardrop Seed Core (Gold payload at bottom) -->
  <path d="M 32 46 C 28.5 50, 28.5 56.5, 32 59.5 C 35.5 56.5, 35.5 50, 32 46 Z" class="seed" />
  <circle cx="32" cy="52" r="1.5" fill="#FFFFFF" opacity="0.4" />
</svg>
